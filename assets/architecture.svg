<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6B5CE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A4BD6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="script" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E67E22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="editor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#219A52;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="12" fill="#1a1a2e"/>

  <text x="400" y="38" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="600">Helios Engine Architecture</text>
  <text x="400" y="56" text-anchor="middle" fill="#888" font-size="11">Top-down dependency flow — each layer only imports from below</text>

  <!-- Layer 1: Editor (top) -->
  <rect x="200" y="75" width="400" height="60" rx="8" fill="url(#editor)" filter="url(#shadow)"/>
  <text x="400" y="101" text-anchor="middle" fill="white" font-size="16" font-weight="600">helios-editor</text>
  <text x="400" y="119" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">ImGui panels, gizmos, viewport, Play/Stop, project system</text>

  <!-- Arrow -->
  <path d="M400 135 L400 158" stroke="#555" stroke-width="2"/>

  <!-- Layer 2: Scripting -->
  <rect x="200" y="163" width="400" height="60" rx="8" fill="url(#script)" filter="url(#shadow)"/>
  <text x="400" y="189" text-anchor="middle" fill="white" font-size="16" font-weight="600">helios-script</text>
  <text x="400" y="207" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">C# via CoreCLR, hot reload, native bridge</text>

  <!-- Arrows from scripting down to all three -->
  <path d="M250 223 L160 255" stroke="#555" stroke-width="2" fill="none"/>
  <path d="M400 223 L400 255" stroke="#555" stroke-width="2"/>
  <path d="M550 223 L640 255" stroke="#555" stroke-width="2" fill="none"/>

  <!-- Layer 3: Renderer, Physics, Audio (independent peers) -->
  <rect x="50" y="260" width="220" height="60" rx="8" fill="url(#mid)" filter="url(#shadow)"/>
  <text x="160" y="286" text-anchor="middle" fill="white" font-size="14" font-weight="600">helios-renderer</text>
  <text x="160" y="304" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">RHI + Vulkan 1.3 + Forward+</text>

  <rect x="290" y="260" width="220" height="60" rx="8" fill="url(#mid)" filter="url(#shadow)"/>
  <text x="400" y="286" text-anchor="middle" fill="white" font-size="14" font-weight="600">helios-physics</text>
  <text x="400" y="304" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">Jolt Physics, auto body lifecycle</text>

  <rect x="530" y="260" width="220" height="60" rx="8" fill="url(#mid)" filter="url(#shadow)"/>
  <text x="640" y="286" text-anchor="middle" fill="white" font-size="14" font-weight="600">helios-audio</text>
  <text x="640" y="304" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">SoLoud, 3D spatial playback</text>

  <!-- Arrows down to core -->
  <path d="M160 320 L160 350 L300 350 L300 370" stroke="#555" stroke-width="2" fill="none"/>
  <path d="M400 320 L400 370" stroke="#555" stroke-width="2"/>
  <path d="M640 320 L640 350 L500 350 L500 370" stroke="#555" stroke-width="2" fill="none"/>

  <!-- Layer 4: Core (bottom) -->
  <rect x="100" y="375" width="600" height="75" rx="8" fill="url(#core)" filter="url(#shadow)"/>
  <text x="400" y="405" text-anchor="middle" fill="white" font-size="16" font-weight="600">helios-core</text>
  <text x="400" y="425" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">ECS (archetype + parallel scheduler) | Assets (async + thread pool) | Serialization | Window | Input</text>

  <!-- Side labels -->
  <text x="30" y="110" fill="#27AE60" font-size="10" font-weight="600" transform="rotate(-90, 30, 110)">APPLICATION</text>
  <text x="30" y="200" fill="#E67E22" font-size="10" font-weight="600" transform="rotate(-90, 30, 200)">SCRIPTING</text>
  <text x="30" y="300" fill="#6B5CE7" font-size="10" font-weight="600" transform="rotate(-90, 30, 300)">RUNTIME</text>
  <text x="30" y="420" fill="#4A90D9" font-size="10" font-weight="600" transform="rotate(-90, 30, 420)">FOUNDATION</text>

  <!-- Note about independence -->
  <rect x="150" y="470" width="500" height="40" rx="6" fill="rgba(255,255,255,0.05)"/>
  <text x="400" y="490" text-anchor="middle" fill="#888" font-size="11">Renderer, Physics, and Audio are fully independent — no cross-dependencies.</text>
  <text x="400" y="504" text-anchor="middle" fill="#888" font-size="11">Link only what your project needs.</text>
</svg>
