site_name: Helios Engine
site_description: A modular, data-driven game engine built with C++20 and Vulkan 1.3
repo_url: https://github.com/RyuTribal/helios
repo_name: RyuTribal/helios

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: amber
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - navigation.tabs

nav:
  - Home: index.md
  - The Helios Book:
    - Introduction: book/index.md
    - Architecture: architecture.md
    - ECS: ecs.md
    - Assets: assets.md
    - Scenes: scenes.md
    - Rendering: rendering.md
    - Physics: physics.md
    - Audio: audio.md
    - Scripting: scripting.md
    - Editor: editor.md
  - API Reference:
    - Overview: api/index.md
    - Core:
      - ECS:
        - World: api/core/ecs/world.md
        - Entity: api/core/ecs/entity.md
        - Query: api/core/ecs/query.md
        - Commands: api/core/ecs/commands.md
        - Scheduler: api/core/ecs/scheduler.md
      - Assets:
        - Asset Server: api/core/assets/asset_server.md
        - Handle: api/core/assets/handle.md
        - Asset Binary: api/core/assets/asset_binary.md
      - Window:
        - Window: api/core/window/window.md
        - Windows: api/core/window/windows.md
      - Input:
        - Raw Input: api/core/input/raw_input.md
        - Input Map: api/core/input/input_map.md
      - Scene:
        - Scene Manager: api/core/scene/scene_manager.md
        - Scene Serializer: api/core/scene/scene_serializer.md
      - App:
        - App: api/core/app/app.md
        - GameFlow: api/core/app/game_flow.md
    - Renderer:
      - Render Plugin: api/renderer/render_plugin.md
      - Render Context: api/renderer/render_context.md
      - Render Settings: api/renderer/render_settings.md
      - RHI:
        - Device: api/renderer/rhi/device.md
        - Command Buffer: api/renderer/rhi/command_buffer.md
        - Texture: api/renderer/rhi/texture.md
        - Buffer: api/renderer/rhi/buffer.md
        - Types: api/renderer/rhi/types.md
    - Physics:
      - Overview: api/physics/index.md
      - PhysicsWorld: api/physics/physics_world.md
      - PhysicsPlugin: api/physics/physics_plugin.md
      - Components: api/physics/components.md
    - Audio:
      - Overview: api/audio/index.md
      - AudioDevice: api/audio/audio_device.md
      - AudioPlugin: api/audio/audio_plugin.md
      - Components: api/audio/components.md
    - Scripting:
      - Overview: api/scripting/index.md
      - C++ API:
        - Overview: api/scripting/cpp/index.md
        - ScriptingPlugin: api/scripting/cpp/scripting_plugin.md
        - ScriptRuntime: api/scripting/cpp/script_runtime.md
        - ScriptInstance & Components: api/scripting/cpp/components.md
      - C# API:
        - Overview: api/scripting/csharp/index.md
        - Entity: api/scripting/csharp/entity.md
        - ScriptBehaviour: api/scripting/csharp/script_behaviour.md
        - TransformComponent: api/scripting/csharp/transform_component.md
        - Input: api/scripting/csharp/input.md
        - Audio: api/scripting/csharp/audio.md
        - Scene: api/scripting/csharp/scene.md
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.details
  - admonition
  - toc:
      permalink: true
